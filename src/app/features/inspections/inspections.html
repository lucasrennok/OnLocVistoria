<div class="page">
  <div class="page-header">
    <h1>Devoluções</h1>
    <p-button label="Nova devolução" icon="pi pi-plus" (click)="newInspection()" />
  </div>

  <p-table
    [value]="inspections()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 20]"
    styleClass="shadow-1"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Cliente</th>
        <th>Empréstimo</th>
        <th>Data</th>
        <th>Avaliação</th>
        <th>Aprovação</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-inspection>
      <tr>
        <td>{{ clientName(inspection.clientId) }}</td>
        <td>{{ loanOrg(inspection.loanId) }}</td>
        <td>{{ inspection.date | date: 'dd/MM/yyyy HH:mm' }}</td>
        <td>
          <p-tag
            [value]="assessmentLabel(inspection.assessment)"
            [severity]="assessmentSeverity(inspection.assessment)"
          />
        </td>
        <td>
          <p-tag
            [value]="approvalLabel(inspection.approval)"
            [severity]="approvalSeverity(inspection.approval)"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="empty">Nenhuma devolução registrada.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
