<div class="page">
  <div class="page-header">
    <h1>Detalhes do empréstimo</h1>
    <p-button label="Voltar" icon="pi pi-arrow-left" text (click)="back()" />
  </div>

  @if (loan(); as loan) {
    <p-card class="info-card">
      <div class="info-head">
        <h2>{{ loan.organization }}</h2>
        <p-tag [value]="label(loan.status)" [severity]="severity(loan.status)" />
      </div>
      <div class="info-grid">
        <div class="info">
          <span class="info-label">Cliente</span>
          <span>{{ client()?.tradeName ?? '—' }}</span>
        </div>
        <div class="info">
          <span class="info-label">Data</span>
          <span>{{ loan.date | date: 'dd/MM/yyyy HH:mm' }}</span>
        </div>
        <div class="info">
          <span class="info-label">Detalhes</span>
          <span>{{ loan.details || '—' }}</span>
        </div>
      </div>
    </p-card>

    <p-card>
      <ng-template #header><h3 class="card-title">Itens emprestados</h3></ng-template>
      <p-table [value]="loan.items" [loading]="loading()" styleClass="shadow-1">
        <ng-template pTemplate="header">
          <tr>
            <th>Patrimônio</th>
            <th>Devolvido</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
          <tr>
            <td>{{ item.patrimonyNumber }}</td>
            <td>
              <p-tag
                [value]="item.returned ? 'Sim' : 'Não'"
                [severity]="item.returned ? 'success' : 'secondary'"
              />
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="2" class="empty">Nenhum item registrado.</td>
          </tr>
        </ng-template>
      </p-table>
    </p-card>
  }
</div>
