<div class="page">
  <div class="page-header">
    <h1>Clientes</h1>
    <p-button label="Novo cliente" icon="pi pi-plus" (click)="newClient()" />
  </div>

  <div class="toolbar">
    <span class="p-input-icon-left w-full">
      <i class="pi pi-search"></i>
      <input
        pInputText
        type="text"
        class="w-full"
        placeholder="Buscar por nome, responsável ou CPF/CNPJ…"
        [formControl]="search"
      />
    </span>
  </div>

  <p-table
    [value]="clients()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 20]"
    styleClass="shadow-1"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Nome fantasia</th>
        <th>Responsável</th>
        <th>CPF/CNPJ</th>
        <th>Localização</th>
        <th style="width: 9rem">Ações</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-client>
      <tr>
        <td>
          <a class="link" [routerLink]="['/clientes', client.id]">{{ client.tradeName }}</a>
        </td>
        <td>{{ client.responsible }}</td>
        <td>{{ client.document | cpfCnpj }}</td>
        <td>{{ client.location }}</td>
        <td>
          <div class="actions">
            <p-button
              icon="pi pi-eye"
              text
              rounded
              title="Ver"
              (click)="open(client)"
            />
            <p-button
              icon="pi pi-pencil"
              text
              rounded
              title="Editar"
              (click)="edit(client)"
            />
            <p-button
              icon="pi pi-trash"
              text
              rounded
              severity="danger"
              title="Excluir"
              (click)="confirmDelete(client)"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="empty">Nenhum cliente encontrado.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
