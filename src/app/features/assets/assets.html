<div class="page">
  <div class="page-header">
    <h1>Equipamentos</h1>
    <p-button label="Novo equipamento" icon="pi pi-plus" (click)="newAsset()" />
  </div>

  <div class="toolbar">
    <p-select
      [options]="statusOptions"
      optionLabel="label"
      optionValue="value"
      [formControl]="statusFilter"
      placeholder="Filtrar por status"
      styleClass="w-15rem"
    />
  </div>

  <p-table
    [value]="assets()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 20]"
    styleClass="shadow-1"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Patrimônio</th>
        <th>Nº de série</th>
        <th>Descrição</th>
        <th>Sub-itens</th>
        <th>Status</th>
        <th style="width: 9rem">Ações</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-asset>
      <tr>
        <td>
          <a class="link" [routerLink]="['/equipamentos', asset.id]">{{ asset.patrimonyNumber }}</a>
        </td>
        <td>{{ asset.serialNumber || '—' }}</td>
        <td>{{ asset.description }}</td>
        <td>{{ asset.subItems.length }}</td>
        <td>
          <p-tag [value]="label(asset.status)" [severity]="severity(asset.status)" />
        </td>
        <td>
          <div class="actions">
            <p-button icon="pi pi-eye" text rounded title="Ver" (click)="open(asset)" />
            <p-button icon="pi pi-pencil" text rounded title="Editar" (click)="edit(asset)" />
            <p-button
              icon="pi pi-trash"
              text
              rounded
              severity="danger"
              title="Excluir"
              (click)="confirmDelete(asset)"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="empty">Nenhum equipamento encontrado.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
