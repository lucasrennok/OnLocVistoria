<div class="page">
  <div class="page-header">
    <h1>Usuários</h1>
    <p-button label="Novo usuário" icon="pi pi-plus" (click)="newUser()" />
  </div>

  <p-table
    [value]="users()"
    [loading]="loading()"
    styleClass="shadow-1"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Papel</th>
        <th style="width: 6rem">Ações</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>
          <p-tag [value]="user.role" [severity]="roleSeverity(user.role)" />
        </td>
        <td>
          <p-button
            icon="pi pi-trash"
            text
            rounded
            severity="danger"
            title="Excluir"
            (click)="confirmDelete(user)"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="empty">Nenhum usuário cadastrado.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
