<div class="page">
  <div class="page-header">
    <h1>Empréstimos avariados</h1>
  </div>

  <p-table
    [value]="damages()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="10"
    styleClass="shadow-1"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Empréstimo</th>
        <th>Item</th>
        <th>Descrição da avaria</th>
        <th>Registrado em</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-damage>
      <tr>
        <td>{{ loanOrg(damage.loanId) }}</td>
        <td>{{ itemPatrimony(damage) }}</td>
        <td>{{ damage.description }}</td>
        <td>{{ damage.registeredAt | date: 'dd/MM/yyyy HH:mm' }}</td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="empty">Nenhum equipamento avariado.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
