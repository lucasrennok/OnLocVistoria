<div class="login-wrapper">
  <p-card class="login-card" header="Bem-vindo(a)" subheader="Sistema de vistoria de equipamentos On.loc">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input
          id="email"
          pInputText
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="voce@empresa.com.br"
        />
        @if (email.invalid && email.touched) {
          <small class="error">Informe um e-mail válido.</small>
        }
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input
          id="password"
          pInputText
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
        @if (password.invalid && password.touched) {
          <small class="error">A senha deve ter ao menos 6 caracteres.</small>
        }
      </div>

      @if (errorMessage) {
        <p-message severity="error" [text]="errorMessage" styleClass="w-full mb-3" />
      }

      <p-button
        type="submit"
        label="Entrar"
        icon="pi pi-sign-in"
        [loading]="loading"
        styleClass="w-full"
      />
    </form>
  </p-card>

  <p class="hint">
    Demonstração — Analista: <code>analista&#64;onloc.com.br</code> ·
    Gestor: <code>gestor&#64;onloc.com.br</code>
  </p>
</div>
